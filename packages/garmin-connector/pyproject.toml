[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "running-lab-garmin-connector"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "garminconnect>=0.2.25",
  "curl-cffi>=0.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.scripts]
garmin-connector = "garmin_connector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
